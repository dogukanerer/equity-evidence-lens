name: Equity Evidence - refresh and deploy

on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC daily = 06:17 Europe/Istanbul. May be delayed/skipped by GitHub.
    - cron: '17 3 * * *'

concurrency:
  group: equity-evidence-publishing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
      - name: Set up Python (standard library only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline safety tests
        run: python -m unittest discover -s tests -q
      - name: Validate current published evidence (no network)
        run: python scripts/refresh_site.py --check-only
      - name: Get verified read-only Base block and build public history
        run: python scripts/refresh_site.py
      - name: Save complete history to default branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .nojekyll data/
          if git diff --cached --quiet; then
            echo 'No new Base block; no content commit needed'
          else
            git commit -m 'data: append verified Base equity observation'
            git push origin HEAD:main
          fi
      - name: Prepare only public website files
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp data/earlier.json data/later.json data/comparison.json data/manifest.json data/history.json _site/data/
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site artifact
        id: deployment
        uses: actions/deploy-pages@v4
